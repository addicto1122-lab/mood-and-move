spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

#배포시 수정
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}

kakao.oauth.client-id=${KAKAO_CLIENT_ID}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET}
kakao.oauth.redirect-uri=http://localhost:8080/api/auth/kakao/callback

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

spring.autoconfigure.exclude=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration

kakao.rest-api-key=${KAKAO_REST_API_KEY}

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL}
