name: MoodAndMove CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React
        run: npm run build

      - name: Build Frontend Docker Image
        run: docker build -t moodandmove-frontend:ci .

  backend:
    name: Spring Boot Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Spring Boot
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew assemble --no-daemon

      - name: Build Backend Docker Image
        run: docker build -t moodandmove-backend:ci ./backend

  publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker build \
            -t ghcr.io/addicto1122-lab/moodandmove-frontend:latest \
            -t ghcr.io/addicto1122-lab/moodandmove-frontend:${{ github.sha }} \
            ./frontend

          docker push --all-tags ghcr.io/addicto1122-lab/moodandmove-frontend

      - name: Build and Push Backend
        run: |
          docker build \
            -t ghcr.io/addicto1122-lab/moodandmove-backend:latest \
            -t ghcr.io/addicto1122-lab/moodandmove-backend:${{ github.sha }} \
            ./backend

          docker push --all-tags ghcr.io/addicto1122-lab/moodandmove-backend
