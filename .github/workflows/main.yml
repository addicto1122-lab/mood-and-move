name: MoodAndMove CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React
        env:
          VITE_KAKAO_MAP_JS_KEY: ${{ secrets.VITE_KAKAO_MAP_JS_KEY }}
        run: |
          test -n "$VITE_KAKAO_MAP_JS_KEY"
          npm run build

      - name: Build Frontend Docker Image
        env:
          VITE_KAKAO_MAP_JS_KEY: ${{ secrets.VITE_KAKAO_MAP_JS_KEY }}
        run: |
          docker build \
            --build-arg VITE_KAKAO_MAP_JS_KEY \
            -t moodandmove-frontend:ci .

  backend:
    name: Spring Boot Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and Test Spring Boot
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Build Backend Docker Image
        run: docker build -t moodandmove-backend:ci ./backend

  publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        env:
          VITE_KAKAO_MAP_JS_KEY: ${{ secrets.VITE_KAKAO_MAP_JS_KEY }}
        run: |
          docker build \
            --build-arg VITE_KAKAO_MAP_JS_KEY \
            -t ghcr.io/addicto1122-lab/moodandmove-frontend:latest \
            -t ghcr.io/addicto1122-lab/moodandmove-frontend:${{ github.sha }} \
            ./frontend

          docker push --all-tags ghcr.io/addicto1122-lab/moodandmove-frontend

      - name: Build and Push Backend
        run: |
          docker build \
            -t ghcr.io/addicto1122-lab/moodandmove-backend:latest \
            -t ghcr.io/addicto1122-lab/moodandmove-backend:${{ github.sha }} \
            ./backend

          docker push --all-tags ghcr.io/addicto1122-lab/moodandmove-backend

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    concurrency:
      group: moodandmove-production
      cancel-in-progress: false

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy WEB and WAS using SSM
        env:
          WEB_ID: i-01fb9a44ba9dc040a
          WAS_ID: i-0d919c2739f1cc89e
        shell: bash
        run: |
          set -euo pipefail

          run_ssm() {
            local instance="$1"
            local command="$2"
            local label="$3"
            local command_id
            local status

            echo "Starting $label"

            command_id=$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --parameters "{\"commands\":[\"$command\"],\"executionTimeout\":[\"900\"]}" \
              --query 'Command.CommandId' \
              --output text)

            for i in $(seq 1 150); do
              if status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance" \
                --query 'Status' \
                --output text 2>&1); then
                :
              elif [[ "$status" == *InvocationDoesNotExist* ]]; then
                sleep 5
                continue
              else
                echo "::error::$status"
                return 1
              fi

              case "$status" in
                Success)
                  echo "$label succeeded"
                  return 0
                  ;;
                Failed|Cancelled|TimedOut)
                  echo "::error::$label failed: $status"
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$instance" \
                    --query '[StandardOutputContent,StandardErrorContent]' \
                    --output text || true
                  return 1
                  ;;
              esac

              sleep 5
            done

            echo "::error::$label timed out"
            return 1
          }

          run_ssm "$WEB_ID" \
            "/opt/moodandmove/scripts/update-web.sh" \
            "Frontend deployment"

          run_ssm "$WEB_ID" \
            "/opt/moodandmove/scripts/publish-backend.sh" \
            "Backend image publishing"

          run_ssm "$WAS_ID" \
            "/opt/moodandmove/scripts/update-was.sh" \
            "Backend deployment"

          echo "MoodAndMove deployment completed"
